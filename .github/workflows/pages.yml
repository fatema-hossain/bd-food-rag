# Publish frontend/ on GitHub Pages, pointed at your Space.
# Repo settings -> Pages -> Source: GitHub Actions;  variable SPACE_URL (e.g. https://fatemahossain0987-bd-food-rag.hf.space)
name: Frontend on GitHub Pages
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the frontend at the Space
        run: echo "window.SHRAG_API = \"${{ vars.SPACE_URL }}\";" > frontend/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
