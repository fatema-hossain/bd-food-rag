# Publish frontend/ on GitHub Pages, pointed at your Space.
# Repo settings -> Pages -> Source: GitHub Actions. No variable needed: open the page with ?api=<server address>.
# Optional variable SPACE_URL bakes a fixed server address into config.js (e.g. an always-on server).
name: Frontend on GitHub Pages
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the frontend at the Space
        if: ${{ vars.SPACE_URL != '' }}
        run: echo "window.SHRAG_API = \"${{ vars.SPACE_URL }}\";" > frontend/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
